# Configurazione usata solo dai test: sostituisce quella in src/main/resources
spring.application.name=Calendar

# Database H2 in memoria in modalità MySQL (viene creato e distrutto ad ogni esecuzione)
spring.datasource.url=jdbc:h2:mem:calendar_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=chiave-segreta-usata-solo-nei-test-lunga-almeno-256-bit
jwt.expiration=3600000
