# Profilo usato dai test Playwright (cartella e2e/): app avviata in locale con H2 in memoria.
# I dati spariscono quando l'app si ferma.
spring.datasource.url=jdbc:h2:mem:calendar_e2e;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=chiave-segreta-usata-solo-nei-test-e2e-lunga-almeno-256-bit
jwt.expiration=3600000
